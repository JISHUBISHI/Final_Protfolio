server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support direct navigation to client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache fingerprinted build assets aggressively; HTML stays fresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
